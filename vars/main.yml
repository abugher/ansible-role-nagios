---
php_fpm:                'php{{ php_version }}-fpm'
install_packages:
  - "{{ php_fpm }}"
  - 'nagios4'
  - 'nmap'
  - 'monitoring-plugins-standard'       # Needed for check_dns, at least.
  # linux-sysctl-defaults is probably installed by default in a fresh OS
  # install, but it is not when upgrading from bookworm to trixie.
  - 'linux-sysctl-defaults'             # Needed for ping.
  - 'bind9-dnsutils'                    # Needed for dig command, for check_dns_record.
remove_packages:
# isp-gateway sometimes has a link-local address (169.254.0.0/16) but is still
# reachable via my gateway if avahi-autoipd is not allowed to create routing
# rules.
  - 'avahi-autoipd'
create_files:
  - owner:              'nagios'
    group:              'nagios'
    mode:               '0750'
    path:               '~nagios/.ssh'
    state:              'directory'
  - owner:              'root'
    group:              'root'
    mode:               '0755'
    path:               '/etc/nagios4/conf.d/objects'
    state:              'directory'
  - owner:              'nagios'
    group:              'nagios'
    mode:               '0755'
    path:               '/var/log/observe_dhcp'
    state:              'directory'
  - owner:              'nagios'
    group:              'nagios'
    mode:               '0644'
    path:               '/var/log/observe_dhcp.log'
    state:              'touch'
  - owner:              'nagios'
    group:              'nagios'
    mode:               '0644'
    path:               '/var/log/observe_dhcp.ret'
    state:              'touch'
  - owner:              'nagios'
    group:              'nagios'
    mode:               '0755'
    path:               '/var/log/observe_dhcp/servers'
    state:              'directory'
  - owner:              'nagios'
    group:              'nagios'
    mode:               '0755'
    path:               '/var/log/observe_dhcp/clients'
    state:              'directory'
sync_dirs:
  - src:                'files/conf/nagios4/conf.d/services/'
    dest:               '/etc/nagios4/conf.d/services/'
    delete:             'yes'
  - src:                'files/conf/nagios4/conf.d/templates/'
    dest:               '/etc/nagios4/conf.d/templates/'
    delete:             'yes'
  - src:                'files/conf/nagios4/stylesheets/'
    dest:               '/etc/nagios4/stylesheets/'
    delete:             'yes'
  - src:                'files/bin/'
    dest:               '/usr/local/bin/'
    delete:             'no'
install_files:
  - owner:              'root'
    group:              'root'
    mode:               '0755'
    src:                'files/conf/nagios4/nagios.cfg'
    dest:               '/etc/nagios4/nagios.cfg'
  - owner:              'root'
    group:              'root'
    mode:               '0755'
    src:                'files/conf/nagios4/cgi.cfg'
    dest:               '/etc/nagios4/cgi.cfg'
  - owner:              'nagios'
    group:              'nagios'
    mode:               '0600'
    src:                "{{ sensitive_inventory_path }}/hosts/{{ inventory_hostname }}/users/nagios/files/ssh_keys/id_rsa"
    dest:               '~nagios/.ssh/id_rsa'
  - owner:              'nagios'
    group:              'nagios'
    mode:               '0644'
    src:                "{{ inventory_path }}/hosts/{{ inventory_hostname }}/users/nagios/files/ssh_keys/id_rsa.pub"
    dest:               '~nagios/.ssh/id_rsa.pub'
  - owner:              'root'
    group:              'root'
    mode:               '0644'
    src:                "{{ role_path }}/files/conf/logos/"
    dest:               '/usr/share/nagios4/htdocs/images/logos/custom/'
  - owner:              'root'
    group:              'www-data'
    mode:               '0640'
    src:                "sensitive/files/conf/htpasswd.users"
    dest:               '/etc/nagios4/htpasswd.users'
remove_files:
  - '/etc/nagios4/objects/'
symlinks:
  - owner:              'root'
    group:              'root'
    src:                '/etc/nginx/sites-available/nagios'
    dest:               '/etc/nginx/sites-enabled/nagios'
  - owner:              'root'
    group:              'root'
    src:                '/etc/nginx/sites-available/nagios.ssl'
    dest:               '/etc/nginx/sites-enabled/nagios.ssl'
template_files:
  - owner:              'root'
    group:              'root'
    mode:               '0644'
    src:                "{{ role_path }}/templates/sites-available/nagios.j2"
    dest:               '/etc/nginx/sites-available/nagios'
  - owner:              'root'
    group:              'root'
    mode:               '0644'
    src:                "{{ role_path }}/templates/sites-available/nagios.ssl.j2"
    dest:               '/etc/nginx/sites-available/nagios.ssl'
  - owner:              'root'
    group:              'root'
    mode:               '0644'
    src:                "templates/hosts.cfg.j2"
    dest:               "/etc/nagios4/conf.d/hosts.cfg"
  - owner:              'root'
    group:              'root'
    mode:               '0644'
    src:                "templates/host_groups.cfg.j2"
    dest:               "/etc/nagios4/conf.d/host_groups.cfg"
  - owner:              'root'
    group:              'root'
    mode:               '0644'
    src:                'templates/objects/commands.cfg.j2'
    dest:               '/etc/nagios4/conf.d/objects/commands.cfg'
  - owner:              'root'
    group:              'root'
    mode:               '0644'
    src:                'templates/objects/contacts.cfg.j2'
    dest:               '/etc/nagios4/conf.d/objects/contacts.cfg'
  - owner:              'root'
    group:              'root'
    mode:               '0644'
    src:                'templates/objects/timeperiods.cfg.j2'
    dest:               '/etc/nagios4/conf.d/objects/timeperiods.cfg'
  - owner:              'root'
    group:              'root'
    mode:               '0755'
    src:                'templates/bin/observe_dhcp.j2'
    dest:               '/usr/local/bin/observe_dhcp'
  - owner:              'root'
    group:              'root'
    mode:               '0644'
    src:                'templates/cron.d/observe_dhcp.j2'
    dest:               '/etc/cron.d/observe_dhcp'
  - owner:              'root'
    group:              'root'
    mode:               '0755'
    src:                'templates/bin/check_dhcp_rogues.j2'
    dest:               '/usr/local/bin/check_dhcp_rogues'
  - owner:              'root'
    group:              'root'
    mode:               '0755'
    src:                'templates/bin/check_debian_update.j2'
    dest:               '/usr/local/bin/check_debian_update'
commands:
  - command:            /usr/sbin/nagios4 -v /etc/nagios4/nagios.cfg
    changed_when:       False
enable_services:
  - 'nagios4'
  - "{{ php_fpm }}"
  - 'fcgiwrap'
restart_services:
  - 'nagios4'
  - "{{ php_fpm }}"
  - 'fcgiwrap'
  - 'nginx'
start_services:
  - 'nagios4'
  - "{{ php_fpm }}"
  - 'fcgiwrap'
